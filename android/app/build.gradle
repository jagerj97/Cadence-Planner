plugins {
    id 'com.android.application'
}

// The version shown to users comes from package.json. Android also needs a versionCode that rises
// with every APK so each installs as an update; that's the CI run number, and it isn't shown.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int
// `-PtestBuild` makes "Cadence Test": its own app beside Cadence (its own data and widgets), for
// trying changes out before they go to everyone. Its shortcuts come from src/preview.
def testBuild = project.hasProperty('testBuild')

android {
    namespace 'app.cadence.planner'
    compileSdk 35

    defaultConfig {
        applicationId 'app.cadence.planner'
        minSdk 26
        targetSdk 35
        versionCode 4 + Math.max(buildNumber, 1)
        versionName appVersion
        manifestPlaceholders = [appLabel: 'Cadence']
    }

    if (testBuild) {
        flavorDimensions 'build'
        productFlavors {
            preview {
                dimension 'build'
                applicationId 'app.cadence.planner.test'
                versionNameSuffix '-test'
                manifestPlaceholders = [appLabel: 'Cadence Test']
            }
        }
    }

    // One fixed signing key so every new build installs over the last one without erasing data.
    signingConfigs {
        cadence {
            storeFile file('cadence.keystore')
            storePassword 'cadence-planner'
            keyAlias 'cadence'
            keyPassword 'cadence-planner'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.cadence }
        release {
            signingConfig signingConfigs.cadence
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
