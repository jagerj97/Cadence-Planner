plugins {
    id 'com.android.application'
}

android {
    namespace 'app.cadence.planner'
    compileSdk 35

    defaultConfig {
        applicationId 'app.cadence.planner'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    // One fixed signing key so every new build installs over the last one without erasing data.
    signingConfigs {
        cadence {
            storeFile file('cadence.keystore')
            storePassword 'cadence-planner'
            keyAlias 'cadence'
            keyPassword 'cadence-planner'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.cadence }
        release {
            signingConfig signingConfigs.cadence
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
