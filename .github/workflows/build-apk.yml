name: Build Cadence APK

# Builds whenever code is pushed to main, or on demand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the app's web files
        run: |
          npm ci
          npm run build:android:web
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../cadence_${APP_VERSION}.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-apk
          path: cadence_${{ env.APP_VERSION }}.apk

      # A release gives a direct download link you can open on your phone. It and the APK are named
      # after the version in package.json (cadence_1.5.7-beta.apk); pushing again without bumping it
      # replaces that version's APK.
      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Cadence v${{ env.APP_VERSION }}
          body: Built from commit ${{ github.sha }}. Download cadence_${{ env.APP_VERSION }}.apk below and open it on your phone to install.
          files: cadence_${{ env.APP_VERSION }}.apk
          make_latest: true
